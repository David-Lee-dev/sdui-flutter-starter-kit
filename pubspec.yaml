name: sdui_starter
description: "SDUI starter app — minimal shell wired to the sdui_engine package."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  sdui_engine:
    path: ../92_sdui-flutter-engine

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^9.2.4
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  go_router: ^14.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
